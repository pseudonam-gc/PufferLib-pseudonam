[base]
package = ocean
env_name = puffer_trading
policy_name = Trading
rnn_name = None

[env]
num_envs = 512

[train]
anneal_lr = False
total_timesteps = 300_000_000
gamma = 0.999
learning_rate = 0.01
minibatch_size = 32768
ent_coef = 0.01

[sweep]
method = Protein
metric = episode_length

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e6
max = 1e7
mean = 5e6
scale = 0.5
