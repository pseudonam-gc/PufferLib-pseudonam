[base]
package = ocean
env_name = puffer_trading
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 4096

[train]
total_timesteps = 1_000_000_000
gamma = 0.999
learning_rate = 0.1
minibatch_size = 32768

[sweep]
method = Protein
metric = episode_length

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e6
max = 1e7
mean = 5e6
scale = 0.5
